# pnpm reads settings from here, not from the "pnpm" field in package.json.
#
# esbuild arrives as a transitive dependency of @remix-run/test (via the remix
# CLI). Its install script links the platform-specific binary; without it the
# package is present but unusable.
#
# It is the only one allowed, and the list is meant to stay that way: an install
# script is somebody else's code running on this machine. lefthook is the one that
# would look like it belongs here and does not — its binary ships inside
# lefthook-<platform>, a package with no scripts at all, and `postinstall` in
# package.json calls `lefthook install` itself rather than letting the dependency
# do it. Anything new showing up here is worth a second look before it is allowed.
allowBuilds:
  esbuild: true
  # Refused, not merely left out: pnpm fails an install over a build script it
  # skipped without being told to, and writes the missing entry into this file
  # itself. `postinstall` in package.json runs `lefthook install` where it can be
  # read, and lefthook's binary ships inside lefthook-<platform>, a package with
  # no scripts, so nothing is lost by refusing this one.
  lefthook: false

# GHSA-g7r4-m6w7-qqqr: esbuild >= 0.27.3 < 0.28.1 allows arbitrary file read via
# its development server on Windows. @remix-run/test asks for ^0.27.1, which caps
# at 0.27.x and so cannot reach the fix on its own — hence the override.
#
# Drop this once @remix-run/test asks for a range that already includes
# 0.28.x; an override that outlives its cause silently pins the whole tree.
overrides:
  esbuild: '0.28.2'
