name: Release

# Every PR merged into `main` tags each application that changed: the merge commit gets
# `<app>-<version>` (`web-2026-11-27`, `publikace-v1.1.0`) and a GitHub Release whose notes
# are the commits that touched apps/<app>/. The deploy is deploy.yml's and ships every
# application either way; this only records what went out.
#
# scripts/release-version.ts decides; release-version.yml runs the same script before the
# merge, so a version that would fail here has already blocked the PR. See
# docs/_branching-model.md § Versions.
#
# **Two jobs, so no code from the repository runs with a token that can write.**
# `release-decide` checks out the merge commit and runs the script on a read-only token;
# `release-tag` never checks anything out, re-validates what it is handed and writes through
# the API alone.
#
# **A failed or cancelled run is re-run** from the Actions page: the event is the same, a tag
# already on the merge commit counts as done and a missing Release is published. An
# application that failed its decision fails again: it is tagged by hand
# (docs/_branching-model.md § Versions).

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

# Two merges into `main` in quick succession would otherwise read the same newest tag and
# claim the same version. A PR closed unmerged gets a group of its own, so it never takes
# the place of a merge's waiting run.
concurrency:
  group: ${{ github.event.pull_request.merged && 'release' || format('release-unmerged-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  release-decide:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      releases: ${{ steps.version.outputs.releases }}
      failed: ${{ steps.version.outputs.failed }}
    steps:
      # The history and the tags, with no token left in .git/config for the script.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The body reaches the script through `env`, never through `${{ }}` in the shell.
      - id: version
        env:
          MODE: release
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: node scripts/release-version.ts

  release-tag:
    needs: release-decide
    if: >-
      needs.release-decide.outputs.releases != '' &&
      (needs.release-decide.outputs.releases != '[]' ||
      needs.release-decide.outputs.failed != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASES: ${{ needs.release-decide.outputs.releases }}
      FAILED: ${{ needs.release-decide.outputs.failed }}
      SHA: ${{ github.event.pull_request.merge_commit_sha }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # What the other job hands over is checked again here, where the token can write: a
      # tag name is only ever `<app>-<version>`, and the notes only ever reach a file. The
      # applications that passed are tagged first; one that failed fails the run after them.
      - name: Tag the merge commit and publish each Release
        run: |
          set -euo pipefail
          tag_pattern='^([a-z][a-z0-9-]*)-(v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)|[0-9]{4}-[0-9]{2}-[0-9]{2}(-[1-9][0-9]*)?)$'
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Not a commit: '$SHA'"; exit 1; }
          [[ "$NUMBER" =~ ^[0-9]+$ ]] || { echo "Not a PR number: '$NUMBER'"; exit 1; }

          stale=''
          count=$(jq 'length' <<<"$RELEASES")
          for ((i = 0; i < count; i++)); do
            app=$(jq -r ".[$i].app" <<<"$RELEASES")
            tag=$(jq -r ".[$i].tag" <<<"$RELEASES")
            latest=$(jq -r ".[$i].latest" <<<"$RELEASES")
            [[ "$app" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "Not an application: '$app'"; exit 1; }
            [[ "$tag" =~ $tag_pattern && "$tag" == "$app-"* ]] || { echo "Not a tag of $app: '$tag'"; exit 1; }
            [[ "$latest" == true || "$latest" == false ]] || { echo "Not a boolean: '$latest'"; exit 1; }

            # A tag already there is done when it is on this commit, and a stale version
            # when it is anywhere else (docs/_branching-model.md § Versions says what then).
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
              --jq ".[] | select(.ref == \"refs/tags/$tag\") | \"\(.object.type) \(.object.sha)\"")
            if [[ -n "$existing" ]]; then
              read -r type target <<<"$existing"
              # An annotated tag's ref points at the tag object; its own object is the commit.
              if [[ "$type" == tag ]]; then
                target=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" --jq .object.sha)
              fi
              if [[ "$target" != "$SHA" ]]; then
                echo "$tag already tags $target, not $SHA."
                stale="$stale $app"
                continue
              fi
              echo "$tag is already on $SHA."
            else
              tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
                -f tag="$tag" -f message="$tag (#$NUMBER)" -f object="$SHA" -f type=commit \
                --jq .sha)
              gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$tag_sha" --silent
              echo "Tagged $SHA as $tag."
            fi

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "The Release $tag exists."
              continue
            fi
            jq -r ".[$i].notes" <<<"$RELEASES" > notes.md
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$tag" --notes-file notes.md --latest="$latest"
            echo "Published the Release $tag."
          done

          if [[ -n "$FAILED" ]]; then
            [[ "$FAILED" =~ ^[a-z][a-z0-9-]*( [a-z][a-z0-9-]*)*$ ]] || { echo "Not applications: '$FAILED'"; exit 1; }
          fi
          not_tagged="$FAILED$stale"
          if [[ -n "${not_tagged// /}" ]]; then
            echo "Not tagged:$([[ -n "$FAILED" ]] && echo " $FAILED")$stale. The log above and the"
            echo "release-decide job's summary say why; docs/_branching-model.md § Versions says how"
            echo "to tag it by hand."
            exit 1
          fi
