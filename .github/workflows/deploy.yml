name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Deploys queue; a running deploy is never cancelled mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Every check workflow runs before the deploy: one per application, and the
  # repository's own. Their paths-filter steps need pull-requests:read, and a reusable
  # workflow can only use permissions the caller grants, so each calling job declares it.
  web-checks:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/web.yml

  repo-checks:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/repo.yml

  publikace-checks:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/publikace.yml

  deploy:
    runs-on: ubuntu-latest
    needs: [web-checks, repo-checks, publikace-checks]
    environment:
      name: production
      url: https://vednemesicnik.cz
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      # Migrations run at machine startup (the web's in docker-entry-point-fly.sh,
      # Publikace's in createPublikace), so back up the still-running old machine
      # BEFORE deploying when this push ships new migrations of either; the backup
      # covers both databases. base: main is required — paths-filter's default base is the
      # repo default branch (dev), so without it the release diffs against
      # merge-base(dev, main), which is empty at a dev→main merge and skips the
      # backup every release. When base names the branch that was pushed to,
      # paths-filter diffs against the commit before the push (github.event.before,
      # i.e. the previous main tip) — not a self-comparison — and auto-fetches that
      # base commit, so the default shallow checkout is fine.
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: main
          filters: |
            migrations:
              - 'apps/web/prisma/migrations/**'
              - 'apps/publikace/db/migrations/**'
      - name: Pre-migration database backup
        if: steps.changes.outputs.migrations == 'true'
        # No continue-on-error: a failed backup must block the deploy.
        run: sh ./scripts/backup-database.sh -pre-migration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # SENTRY_AUTH_TOKEN is passed as a BuildKit build secret (build-time only, not
      # a Fly runtime secret); org/project are non-secret build args. The build then
      # uploads source maps to Sentry and deletes them from the deployed assets. When
      # the secret/vars are unset the build simply skips Sentry (see docker/fly).
      - run: >
          flyctl deploy --remote-only --wait-timeout 5m
          --build-secret sentry_auth_token="$SENTRY_AUTH_TOKEN"
          --build-arg SENTRY_ORG="$SENTRY_ORG"
          --build-arg SENTRY_PROJECT="$SENTRY_PROJECT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      # Probe the Fly origin directly, not the public vednemesicnik.cz domain:
      # Cloudflare fronts the public domain and blocks CI runner IPs with 403.
      # The origin confirms the deployed app booted and serves over TLS.
      - name: Smoke test Fly origin /health
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 \
            https://cz-vednemesicnik.fly.dev/health
      # Publikace's own certificate on the same origin, reached without the public
      # DNS (--connect-to), so the probe never meets Cloudflare whatever its record
      # does. Its sign-in page answers only once createPublikace started; a refused
      # configuration answers 503 here while the web above still passes.
      - name: Smoke test Publikace on the Fly origin
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 20 \
            --connect-to publikace.vednemesicnik.cz:443:cz-vednemesicnik.fly.dev:443 \
            https://publikace.vednemesicnik.cz/sign-in
      - name: Show app status
        if: always()
        run: flyctl status --app cz-vednemesicnik
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
