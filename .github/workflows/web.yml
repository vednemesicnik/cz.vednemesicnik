name: Web

# The checks of the web in apps/web. Each job carries the web's name, because the
# branch-protection ruleset requires checks by job name and every application brings its
# own lint, typecheck and test.
#
# On a pull request a job runs only when the web or a file it depends on changed. The
# gate is a job-level `if:`, never `on.paths`: a skipped job counts as passed for a
# required check, while a workflow that never starts leaves the check "expected" forever.
# Called from deploy.yml, every job runs.

on:
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

# Cancel stale runs on new pushes to a PR, but never cancel a run started via
# workflow_call from the deploy workflow. In a called workflow github.workflow is the
# caller's name, so the prefix keeps this group apart from repo.yml's.
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter reads the PR's changed files via the API on pull_request
    # events; the top-level contents:read alone is not enough.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'biome.json'
              - '.github/workflows/web.yml'

  web-lint:
    needs: web-changes
    if: github.event_name != 'pull_request' || needs.web-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # reads version from packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check apps/web

  web-typecheck:
    needs: web-changes
    if: github.event_name != 'pull_request' || needs.web-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./data/sqlite.db
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm gas:types:generate
      - run: pnpm --filter web app:typecheck

  web-test:
    needs: web-changes
    if: github.event_name != 'pull_request' || needs.web-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./data/sqlite.db
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm gas:types:generate
      - run: pnpm --filter web test

  web-build:
    needs: web-changes
    if: github.event_name != 'pull_request' || needs.web-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./data/sqlite.db
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm gas:types:generate
      - run: pnpm app:build

  web-storybook:
    needs: web-changes
    if: github.event_name != 'pull_request' || needs.web-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./data/sqlite.db
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm gas:types:generate
      - run: pnpm build-storybook
